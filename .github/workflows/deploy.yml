name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # ferjani.dev pulls this branch when GitHub's push webhook fires.
      - name: Publish to the deploy branch
        working-directory: build
        run: |
          git init -q -b deploy
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Deploy ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
          rm -rf .git
      # Pages needs a public repo on the free plan, so a private repo only builds.
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
